name: main

on:
  push:
    branches:
      - main
      - "feature/**"
      - "dependabot/**"
    tags-ignore:
      - v*
  workflow_dispatch:

jobs:
  prerequisites:
    uses: pulumiverse/infra/.github/workflows/provider-prerequisites.yaml@main
    with:
      provider: statuscake
      goversion: 1.24.x
  build:
    needs: prerequisites
    uses: pulumiverse/infra/.github/workflows/provider-build-sdk.yaml@main
    with:
      provider: statuscake
      dotnetversion: 3.1.301
      goversion: 1.24.x
      nodeversion: 22.x
      pythonversion: "3.11"
